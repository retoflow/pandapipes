[metadata]
description_file = installation.rst
license_file = LICENSE

[pydocstyle]
convention = pep257
# D213 (summary on the second line) is the opposite of D212 (summary on the first line,
# pep257's own convention) - pydocstyle can never satisfy both for the same multi-line
# docstring. Without this, some rule sets/tools end up with both enabled at once, so no
# docstring formatting can ever be fully clean. D212 is the convention this codebase follows.
add-ignore = D213
